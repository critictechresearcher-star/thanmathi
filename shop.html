<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Thanmathi Exports</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: #0a0a0a; color: #fff; }
        .navbar { padding: 20px 5%; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .navbar a { color: #d4af37; text-decoration: none; font-weight: bold; font-size: 1.2rem; font-family: 'Cinzel', serif; }
        .nav-links a { color: #fff; margin-left: 20px; font-size: 0.9rem; font-family: 'Montserrat', sans-serif; }
        
        .shop-header { text-align: center; padding: 60px 20px; }
        .shop-header h1 { font-family: 'Cinzel', serif; font-size: 2.5rem; color: #d4af37; margin: 0; }
        
        .category-filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 40px; padding: 0 5%; }
        .filter-btn { background: transparent; border: 1px solid #d4af37; color: #fff; padding: 10px 20px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: #d4af37; color: #000; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 0 5% 80px; max-width: 1400px; margin: 0 auto; }
        .product-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; transition: 0.3s; cursor: pointer; text-decoration: none; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); border-color: #d4af37; box-shadow: 0 10px 20px rgba(212, 175, 55, 0.1); }
        .product-img { width: 100%; height: 280px; object-fit: contain; background: #fff; }
        .product-info { padding: 20px; text-align: center; }
        .product-title { color: #fff; font-size: 1.1rem; margin: 0 0 10px; font-weight: 500; }
        .product-price { color: #d4af37; font-weight: 600; font-size: 1.2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">THANMATHI</a>
        <div class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a></div>
    </nav>

    <div class="shop-header">
        <h1>Our Collections</h1>
        <p>Sustainable luxury crafted from nature</p>
    </div>

    <div class="category-filters" id="filters"></div>
    <div class="product-grid" id="grid"></div>

    <script src="products.js"></script>
    <script>
        const categories = ["All", ...new Set(catalogProducts.map(p => p.category))];
        const filtersDiv = document.getElementById('filters');
        const gridDiv = document.getElementById('grid');

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = cat === 'All' ? 'filter-btn active' : 'filter-btn';
            btn.innerText = cat;
            btn.onclick = () => filterProducts(cat, btn);
            filtersDiv.appendChild(btn);
        });

        function renderGrid(products) {
            gridDiv.innerHTML = '';
            products.forEach(p => {
                gridDiv.innerHTML += `
                    <a href="product.html?id=${p.id}" class="product-card">
                        <img src="${p.images[0]}" alt="${p.name}" class="product-img" onerror="this.src='Imges/2nd.png'">
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price}</div>
                        </div>
                    </a>
                `;
            });
        }

        function filterProducts(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            if (category === 'All') renderGrid(catalogProducts);
            else renderGrid(catalogProducts.filter(p => p.category === category));
        }

        renderGrid(catalogProducts);
    </script>
</body>
</html>
